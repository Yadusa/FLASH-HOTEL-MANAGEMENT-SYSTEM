<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bank-login-bg">

<div class="box">
    <div class="bank-title" id="bankName"></div>
    <h2>Online Banking Login</h2>

    <!-- Wrap inputs in a form -->
    <form id="loginForm">
        <label>User ID</label>
        <input type="text" id="userId" placeholder="Enter User ID" required>
        
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password" required>
        
        <button type="submit">Login</button>
    </form>
</div>

<script>
function getQuery(key) {
    return new URLSearchParams(window.location.search).get(key);
}
document.getElementById("bankName").innerHTML =
    "Selected Bank: <b>" + getQuery("bank") + "</b>";

// Use form submit event to handle redirection
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault(); // Prevent actual form submission
    // All required fields are already validated by browser
    window.location.href = "bank_otp.html?bank=" + getQuery("bank");
});
</script>

</body>
</html>
