<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="otp-bg">

<div class="box">
    <h2>OTP Verification</h2>
    <p>A 6-digit OTP has been sent to your registered device</p>
    <input type="text" id="otp" maxlength="6" placeholder="••••••">
    <button onclick="verify()">Verify</button>
    <div class="timer" id="timerMsg">OTP expires in <b>60</b> seconds</div>
</div>

<script>
let time = 60;
const timer = setInterval(() => {
    time--;
    document.querySelector("#timerMsg b").textContent = time;
    if (time == 0) {
        clearInterval(timer);
        alert("OTP expired! Request new OTP.");
    }
}, 1000);

function verify() {
    if (document.getElementById("otp").value.length === 6) {
        window.location.href = "payment_success.html";
    } else {
        alert("Invalid OTP — must be 6 digits");
    }
}
</script>

</body>
</html>
