<script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>

<!DOCTYPE html>
<html>
<head>
    <title>tng QR Payment</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
</head>
<body>
<div class="container center">
    <h2>Scan to Pay – TNG</h2>
    <canvas id="qr"></canvas>
    <p>Waiting for payment...</p>
</div>

<script>
    // Data inside QR → you can change anything (ID, wallet ID, amount, name, etc.)
    const paymentData = "WALLET=TNG; AMOUNT=later add; ORDERID=later add";

    var qr = new QRious({
        element: document.getElementById("qr"),
        size: 250,
        value: paymentData
    });
</script>

</body>
</html>
