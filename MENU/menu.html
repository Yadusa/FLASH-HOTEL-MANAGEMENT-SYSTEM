<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu | The Obsidian</title>
    <link rel="stylesheet" href="../hotelpage.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: #fff;
        }

        .menu-container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        .menu-container h1 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 40px;
        }

        .menu-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 30px;

          max-width: 900px;        /* controls grid width */
          margin: 0 auto;          /* centers the grid */
          justify-items: center;   /* centers images inside grid cells */
        }

        .menu-grid img {
          width: 100%;
          max-width: 260px;        /* keeps images consistent */
          border-radius: 12px;
        }

        .menu-grid img:hover {
            transform: scale(1.05);
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 40px;
            display: inline-block;
            padding: 8px 15px;
            background: transparent;
            color: #ccc;
            text-decoration: none;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-button:hover {
           background: #eee;
           color: var(--color-primary);
        }
        
    </style>
</head>

<body>
    <div class="menu-container">
        <h1>Our Menu</h1>
        <a href="../hotel.php" class="back-button"> Back to Main Page</a>

        <div class="menu-grid">
            <img src="1.png" alt="Menu Page 1">
            <img src="2.png" alt="Menu Page 2">
            <img src="3.png" alt="Menu Page 3">
            <img src="4.png" alt="Menu Page 4">
            <img src="5.png" alt="Menu Page 5">
            <img src="6.png" alt="Menu Page 6">
        </div>
    </div>
</body>
</html>
